[package]
name = "harness-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde_json = "1"
httpdate = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 0
