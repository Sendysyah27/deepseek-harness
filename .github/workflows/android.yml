name: Android vc317

# CI pertama repo Harness (repo sebelumnya tidak punya workflow sama sekali).
# Branch vc317-rust = main (vc309, 13 Nov) + tree vc316 + slice 0+1 Rust
# (DsFailure via RustCore JNI + crate harness-core). Main TIDAK disentuh.
# Job: cargo test -> suite JVM 1472/1473 (R2-4.1 = assert usang warisan vc315,
# ditoleransi eksplisit di tests/run-suite-ci.sh) -> build APK senz+pure
# via build.py -> verifikasi (apksigner, aapt2, libharness_core.so ada)
# -> upload APK sebagai artifact.
# Slice 5 (vc319): ConcatApiClient.kt -> Rust (concat_api_client.rs,
# seam concatApiJson, VERSION 3); P5 157 cek (rust 102 via TCP 7420 +
# .so host + kotlin 55 fallback).
# Slice 6 (vc320): ToolRegistry.kt + AgentPrompt.kt (fungsi murni) +
# SkillJudge trigger scoring -> Rust (tool_registry.rs +
# tool_registry_data.rs + agent_prompt.rs + skill_trigger.rs, seam
# toolRegistryJson/agentPromptJson/skillTriggerJson, VERSION 4);
# P6 155 cek (rust 80 + kotlin 75 fallback).
# Fix vc321 (BUKAN slice 7): RoomLane IXL — GroupChat selectCatalog +
# continuationPromptVc321 (delta), 1-1 riwayat adaptif + guard reset sesi
# server proaktif (SlotClient + DsApiClient via TurnMetrics); P7 52 cek;
# RUST_CORE_VERSION tetap 4 (tidak ada fungsi JNI baru).
# Fix vc322 (BUKAN slice 7 — rusqlite DI-PAUSE, lanjut vc323): bocor sesi
# server DeepSeek — giliran 1-1 lanjutan dikirim DELTA (bukan prompt penuh)
# + penghitung sesi + primed-flag; P8 73 cek; suite 1200/1201 (R2-4.1
# ditoleransi); RUST_CORE_VERSION tetap 4.
# Slice 7 vc323: SQLite via rusqlite — EventDb/ArtifactStore/
# ParkedApprovalStoreVc305/GraphDb via seam sqliteJson generik
# (sqlite.rs + sqlite_schema.rs, rusqlite 0.32 bundled); P9 134 cek
# (rust 107 + kotlin 27 fallback); suite 1334/1335 (R2-4.1 ditoleransi);
# RUST_CORE_VERSION 4->5; MemoryDb wrapper TIDAK di-port (sisa kerja).
# Slice 8 vc324: HTTP clients via ureq — OcClient/ApiClients/McpHttp/
# SlotClient (postJson + mesin SSE)/Gmail (decodeWord + fetchHeaders)/
# McpOAuth (PKCE + form + POST token) via seam httpJson generik
# (http.rs + sse.rs, ureq 2.12 tls + sha2 0.10); P10 138 cek
# (rust 88 + kotlin 50 fallback); suite 1472/1473 (R2-4.1 ditoleransi);
# RUST_CORE_VERSION 5->6; DsApiClient TIDAK disentuh (split-nya slice 11);
# transport Gmail IMAP/SMTP + openEventStream + listener loopback tetap Kotlin.
# Slice 9 vc325: server :4198 via workerEndpointJson — WorkerEndpoint/
# WorkerEndpointLogic (parse_route + HMAC + framing + idempotency) via seam
# worker_endpoint.rs (sha2, tanpa tokio/dep baru); P11 302 cek
# (rust 151 + kotlin 151 fallback); suite 1774/1775 (R2-4.1 ditoleransi);
# RUST_CORE_VERSION 6->7; loop accept/dispatch/token/kuota tetap Kotlin;
# WorkerLogic/WorkerQueue/WorkerJanitorLogic/WorkerRegistry TIDAK disentuh.
#
# CATATAN: android-actions/setup-android@v3 DICOBA di run pertama dan
# GAGAL di langkahnya sendiri — diganti SDK bawaan runner ubuntu-latest
# (/usr/lib/android-sdk + cmdline-tools), tanpa action tambahan.

on:
  push:
    branches: [vc317-rust]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager" || { echo "::error::sdkmanager tidak ada di $SDK"; exit 1; }
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android packages (platform 34, build-tools 34, NDK 30)
        run: |
          set -euo pipefail
          # Lisensi sudah diterima di image runner; jangan pakai `yes |`
          # (SIGPIPE + pipefail membunuh step bila sdkmanager cepat selesai).
          printf 'y\ny\ny\n' | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;30.0.16248370" || sdkmanager --sdk_root="$ANDROID_HOME" "ndk"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"

      - name: Install Rust 1.93.1 + aarch64-linux-android
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android

      - name: Install Kotlin 1.9.20 (sama dengan yang dipakai vc316 lokal)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/kotlin-dist"
          cd "$HOME/kotlin-dist"
          curl -sSL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.20/kotlin-compiler-1.9.20.zip
          unzip -q -o kotlin-compiler.zip
          echo "$HOME/kotlin-dist/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlin-dist/kotlinc/bin/kotlinc" -version

      - name: cargo test (harness-core)
        working-directory: harness-core
        run: cargo test --locked

      # ARM64-ONLY (arahan Sendy 06:58): Rust hanya aarch64-linux-android,
      # APK hanya berisi native lib arm64-v8a — tanpa x86_64/ABI lain.
      - name: Fetch main (untuk diff check suite)
        run: git fetch origin main --depth=1

      - name: Suite 0 — kompilasi tree
        run: bash tests/run-suite-ci.sh 0

      - name: Suite P1 DsFailure (103 cek)
        run: bash tests/run-suite-ci.sh P1

      - name: Suite P2 PowSolver parity (36 cek)
        run: bash tests/run-suite-ci.sh P2

      - name: Suite P3 RedactSecrets parity (94 cek)
        run: bash tests/run-suite-ci.sh P3

      - name: Suite P4 SmallModules parity (235 cek)
        run: bash tests/run-suite-ci.sh P4

      - name: Suite P5 ConcatApi parity (157 cek, rust 102 + kotlin 55)
        run: bash tests/run-suite-ci.sh P5

      - name: Suite P6 ToolRegistry+AgentPrompt parity (155 cek, rust 80 + kotlin 75)
        run: bash tests/run-suite-ci.sh P6

      - name: Suite P7 RoomLane IXL fix vc321 (52 cek)
        run: bash tests/run-suite-ci.sh P7

      - name: Suite P8 SessFix vc322 (73 cek)
        run: bash tests/run-suite-ci.sh P8

      - name: Suite P9 Rusqlite vc323 (134 cek, rust 107 + kotlin 27)
        run: bash tests/run-suite-ci.sh P9

      - name: Suite P10 HTTP vc324 (138 cek, rust 88 + kotlin 50)
        run: bash tests/run-suite-ci.sh P10

      - name: Suite P11 Server :4198 vc325 (302 cek, rust 151 + kotlin 151)
        run: bash tests/run-suite-ci.sh P11

      - name: Suite N9 audit (46 cek)
        run: bash tests/run-suite-ci.sh N9

      - name: Suite BR browser (45 cek)
        run: bash tests/run-suite-ci.sh BR

      - name: Suite IXL input-limit (72 cek)
        run: bash tests/run-suite-ci.sh IXL

      - name: Suite R1 Concat API (64 cek)
        run: bash tests/run-suite-ci.sh R1

      - name: Suite R2 Concat wiring (69 cek; R2-4.1 usang ditoleransi)
        run: bash tests/run-suite-ci.sh R2

      - name: Suite C — diff vs main
        run: bash tests/run-suite-ci.sh C

      - name: Suite D — sapu tree
        run: bash tests/run-suite-ci.sh D

      - name: Build APK Main (senz)
        run: python3 build.py --flavor senz

      - name: Build APK Pure
        run: python3 build.py --flavor pure

      - name: Verify APKs
        run: |
          set -euo pipefail
          ls -l ./*.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          for apk in ./*.apk; do
            echo "== $apk =="
            "$BT/aapt2" dump badging "$apk" | head -3
            "$BT/apksigner" verify --print-certs "$apk"
            SO_BYTES=$(unzip -p "$apk" lib/arm64-v8a/libharness_core.so | wc -c)
            echo "libharness_core.so bytes in APK: $SO_BYTES"
            test "$SO_BYTES" -gt 100000 || { echo "::error::libharness_core.so hilang/kecil di $apk"; exit 1; }
          done
          md5sum ./*.apk
          sha256sum ./*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: harness-vc317-apks
          path: ./*.apk
          if-no-files-found: error
